<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PDF form harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #status {
        font: 12px ui-monospace, monospace;
        padding: 4px 8px;
        background: #eee;
        border-bottom: 1px solid #ccc;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: calc(100% - 25px);
      }
      :root {
        --sunken: #f3f3f3;
        --paper: #fff;
        --border: #ddd;
        --ink-tertiary: #888;
        --danger: #c00;
        --accent: #8a5a44;
        --needs-input: #a8742c;
        --radius-card: 6px;
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.12);
        --font-mono: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="status">idle</div>
    <div id="app"></div>
    <script type="module" src="./pdf-main.ts"></script>
  </body>
</html>
